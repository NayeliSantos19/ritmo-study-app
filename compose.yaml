services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: '1'
      SITE_URL: https://${DOMAIN:?Define DOMAIN en .env}
    volumes:
      - ritmo-data:/app/data
    expose:
      - '3000'
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  ritmo-data:
  caddy-data:
  caddy-config:
